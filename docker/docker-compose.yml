services:
  app:
    build: .
    image: awesome-nexa
    container_name: awesome-nexa
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - ETERNALDB_HOST=${ETERNALDB_HOST}
      - MAILCHIMP_API_KEY=${MAILCHIMP_API_KEY}
    logging:
      driver: 'json-file'
      options:
        max-file: '5'
        max-size: '10m'
